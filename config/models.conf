# 역할별 모델 배정
#
#   형식:  <프로필ID>  <모델>
#   적용:  ./scripts/set-models.sh --dry-run   →   ./scripts/set-models.sh
#
# 선택 가능한 모델 확인:
#   hermes model            공급사·모델 선택 마법사 (목록이 여기서 보인다)
#   hermes profile list     현재 배정 상태
#
# 모델을 바꾸려면 그 공급사가 먼저 인증되어 있어야 한다.
# 인증되지 않은 공급사의 모델을 넣으면 해당 프로필이 호출에 실패한다.
#   hermes setup model      공급사 추가 (Anthropic · OpenRouter · Copilot · Nous Portal …)
#
# ── 배정 의도 ────────────────────────────────────────────────────────
#
# 성향에 맞는 특성을 적어둔다. 실제 모델은 사용 가능한 것 중에서 고른다.
#
#   lucas   추론력 최상위      최종 결정과 태스크 분해. 가장 좋은 모델을 준다
#   grace   일관성 · 열거      예외 상황을 빠짐없이 나열해야 한다
#   brian   코드 강점          구현 방식과 성능 근거
#   emma    발산적             새 UI·경험 안을 여러 개 내야 한다
#   mia     결정성 최우선      같은 입력에 같은 판정. 흔들리면 QA가 아니다
#   leo     절차 정확성        배포·롤백 순서를 틀리면 안 된다
#   david   수치 · 표 처리     계산이 틀리면 근거가 무너진다
#   aiden   최신 모델          새 기술을 다루는 역할이므로 가장 새 것을
#   jack    일관성             보안 판단은 매번 같아야 한다
#   oscar   반론 생성 · 긴 맥락  검토되지 않은 각도를 끌어내야 한다
#
# ── 현재 배정 ────────────────────────────────────────────────────────
# 인증된 공급사가 OpenAI Codex 뿐이라 일단 전부 동일하다.
# 공급사를 추가한 뒤 아래 값만 바꾸고 스크립트를 다시 돌리면 된다.

lucas   gpt-5.6-terra
grace   gpt-5.6-terra
brian   gpt-5.6-terra
emma    gpt-5.6-terra
mia     gpt-5.6-terra
leo     gpt-5.6-terra
david   gpt-5.6-terra
aiden   gpt-5.6-terra
jack    gpt-5.6-terra
oscar   gpt-5.6-terra

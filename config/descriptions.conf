# 프로필 설명 — Kanban decomposer 의 태스크 라우팅 기준
#
#   형식:  <프로필ID>|<설명>
#   적용:  ./scripts/set-descriptions.sh --dry-run  →  ./scripts/set-descriptions.sh
#
# decomposer 는 프로필 이름만으로 추측하지 않고 이 설명을 읽어 담당자를 정한다.
# 설명이 없으면 전부 kanban.default_assignee 로 떨어진다.
#
# 작성 원칙 — 성격이 아니라 **어떤 태스크를 맡아야 하는가**를 쓴다.
#   나쁨:  "보수적이고 리스크를 싫어한다"
#   좋음:  "권한·인증·데이터 흐름·공급망 위험을 검토한다"
#
# 저장 위치: <profile_dir>/profile.yaml

lucas|Tech Lead. 여러 역할의 검토 결과를 종합해 최종 결정을 내린다. 아키텍처 방향, 비용과 리스크 비교, Go/No-Go 판단, 우선순위 조율을 맡는다. 개별 영역의 깊은 검토가 아니라 통합 판단이 필요한 태스크에 배정한다.
grace|Business Analyst. 현업 요구사항을 실행 가능한 업무 규칙으로 정의하고, 기존 정책·규정과의 충돌을 검토한다. 예외 상황·경계 조건·권한 정책 명세, 기능 변경이 실제 업무 흐름에 미치는 영향 분석을 맡는다.
brian|Backend Engineer. 서버·API 설계, 데이터 모델링, 성능 최적화, 리팩토링을 맡는다. 구현 방식 선택, 프레임워크 전환 설계, 성능 근거 산정, 기술 부채 평가가 필요한 태스크에 배정한다.
emma|Frontend / UX Engineer. 화면·컴포넌트 구현과 UX 설계를 함께 맡는다. 사용자 여정 설계, 인터랙션과 상태 표현, 디자인 시스템, 접근성·반응형 검토가 필요한 태스크에 배정한다.
mia|QA Engineer. 테스트 설계와 검증을 맡는다. 회귀 위험 판단, 테스트 커버리지 확보 방안, 재현 절차 수립, 릴리스 가능 여부 판정이 필요한 태스크에 배정한다. 증거 없는 결론을 내지 않는다.
leo|DevOps / SRE. 배포·인프라·운영 안정성을 맡는다. CI/CD 파이프라인, 무중단 배포와 롤백 절차, 모니터링과 장애 예방, 운영 전환 경로 설계가 필요한 태스크에 배정한다.
david|Data Analyst. 데이터 분석과 지표 설계를 맡는다. KPI 정의, 통계 해석, 효과 측정 방법 수립, 수치 근거 검증이 필요한 태스크에 배정한다. 주장의 출처와 표본을 확인한다.
aiden|AI Engineer. AI·LLM 기능 설계와 통합을 맡는다. 모델 선택과 평가, 프롬프트·파이프라인 최적화, 업무 자동화 적용 가능성 판단이 필요한 태스크에 배정한다.
jack|Security Engineer. 보안 검토와 위협 모델링을 맡는다. 권한·인증·인가 설계, 데이터 흐름과 반출 경로 점검, 신규 의존성의 공급망 위험, 컴플라이언스 확인이 필요한 태스크에 배정한다.
oscar|Devil's Advocate. 개발자가 아니며 구현에 관여하지 않는다. 설계와 문서의 전제를 반박하고, 검토되지 않은 대안과 실패 시나리오를 끄집어낸다. 결론이 나뉠 만한 안건의 반대 검토에 배정한다.
